services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:8000"
    environment:
      - OCR_BATCH_SIZE=256
      - RECOGNITION_BATCH_SIZE=256
      - DETECTION_BATCH_SIZE=256
      - OMP_NUM_THREADS=32
      - PYTHONUNBUFFERED=1
    volumes:
      # Cache Surya models between container restarts
      - model-cache:/root/.cache/datalab
      # Persist processed outputs
      - output-data:/tmp/pdf_processor/outputs
      # Persist uploaded files
      - uploads:/tmp/pdf_processor/uploads
    restart: unless-stopped
    # ── Uncomment below for GPU support ──────────────────────
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  model-cache:
  output-data:
  uploads:
