<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoterXcel - Live Progress</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
        /* Glassmorphism utility */
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden antialiased selection:bg-indigo-500 selection:text-white" x-data="progressApp()" x-init="init()">
    
    <!-- Background Gradient Effects -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute -top-[40%] -left-[20%] w-[70%] h-[70%] rounded-full bg-indigo-600/20 blur-[120px]"></div>
        <div class="absolute top-[20%] -right-[20%] w-[60%] h-[60%] rounded-full bg-purple-600/20 blur-[100px]"></div>
        <div class="absolute -bottom-[40%] left-[10%] w-[80%] h-[80%] rounded-full bg-blue-600/20 blur-[120px]"></div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <!-- Header -->
        <header class="flex items-center justify-between mb-12">
            <div>
                <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 drop-shadow-sm">
                    Job Progress Dashboard
                </h1>
                <p class="mt-2 text-slate-400 text-sm font-medium">Real-time monitoring of VoterExtractor tasks</p>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="flex items-center px-4 py-2 glass rounded-full shadow-lg">
                    <span class="relative flex h-3 w-3 mr-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
                    </span>
                    <span class="text-sm font-semibold text-emerald-100" x-text="jobsCount + ' Total Jobs'"></span>
                </div>
                <!-- Refresh Button manually -->
                <button @click="fetchJobs(true)" :disabled="loading" class="p-2.5 rounded-full glass hover:bg-white/10 transition-colors disabled:opacity-50">
                    <svg :class="{'animate-spin': loading}" class="w-5 h-5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Stats Overview Row -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
            <!-- Active Jobs -->
            <div class="glass rounded-xl p-6 shadow-xl relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-indigo-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="flex justify-between items-start relative z-10">
                    <div>
                        <p class="text-slate-400 text-sm font-medium mb-1">Active</p>
                        <h3 class="text-3xl font-bold text-white" x-text="activeJobsCount">0</h3>
                    </div>
                    <div class="p-3 bg-indigo-500/20 rounded-lg text-indigo-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Queued Jobs -->
            <div class="glass rounded-xl p-6 shadow-xl relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-amber-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="flex justify-between items-start relative z-10">
                    <div>
                        <p class="text-slate-400 text-sm font-medium mb-1">Queued</p>
                        <h3 class="text-3xl font-bold text-white" x-text="queuedJobsCount">0</h3>
                    </div>
                    <div class="p-3 bg-amber-500/20 rounded-lg text-amber-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Completed Jobs -->
            <div class="glass rounded-xl p-6 shadow-xl relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="flex justify-between items-start relative z-10">
                    <div>
                        <p class="text-slate-400 text-sm font-medium mb-1">Completed</p>
                        <h3 class="text-3xl font-bold text-white" x-text="completedJobsCount">0</h3>
                    </div>
                    <div class="p-3 bg-emerald-500/20 rounded-lg text-emerald-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                </div>
            </div>

            <!-- Failed Jobs -->
            <div class="glass rounded-xl p-6 shadow-xl relative overflow-hidden group">
                <div class="absolute inset-0 bg-gradient-to-br from-rose-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="flex justify-between items-start relative z-10">
                    <div>
                        <p class="text-slate-400 text-sm font-medium mb-1">Failed</p>
                        <h3 class="text-3xl font-bold text-white" x-text="failedJobsCount">0</h3>
                    </div>
                    <div class="p-3 bg-rose-500/20 rounded-lg text-rose-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Area: List of Jobs -->
        <div class="space-y-6">
            
            <template x-if="Object.keys(jobs).length === 0 && !firstLoad">
                <div class="glass rounded-2xl p-12 text-center shadow-xl">
                    <svg class="w-16 h-16 mx-auto text-slate-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                    <h3 class="text-xl font-semibold text-white mb-2">No jobs in queue</h3>
                    <p class="text-slate-400">Upload PDFs using the API to see them appear here.</p>
                </div>
            </template>
            
            <template x-if="firstLoad">
                <div class="flex justify-center items-center py-20">
                    <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-indigo-500"></div>
                </div>
            </template>

            <!-- Render Jobs -->
            <template x-for="[id, job] in sortedJobs" :key="id">
                <div class="glass rounded-2xl p-6 shadow-xl transition-all duration-300 hover:shadow-indigo-500/10 hover:border-indigo-500/30">
                    
                    <div class="flex flex-col md:flex-row md:items-start justify-between gap-6">
                        <!-- Left Side: Job Details -->
                        <div class="flex-1 space-y-4">
                            <!-- Header row: ID + Status Badge -->
                            <div class="flex items-center gap-3 flex-wrap">
                                <span class="font-mono text-sm text-slate-400 bg-slate-800/50 px-3 py-1 rounded-full border border-slate-700/50" x-text="id"></span>
                                
                                <!-- Status Badges -->
                                <span x-show="job.status === 'processing'" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                                    <span class="w-2 h-2 mr-2 rounded-full bg-indigo-400 animate-pulse"></span>
                                    Processing
                                </span>
                                <span x-show="job.status === 'queued'" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                    <span class="w-2 h-2 mr-2 rounded-full bg-amber-400"></span>
                                    Queued
                                </span>
                                <span x-show="job.status === 'completed'" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                    <svg class="w-3 h-3 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                    Completed
                                </span>
                                <span x-show="job.status === 'failed'" class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                                    <svg class="w-3 h-3 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    Failed
                                </span>

                                <span class="text-xs text-slate-500" x-text="formatDate(job.created_at)"></span>
                            </div>

                            <!-- Files -->
                            <div class="flex items-start gap-3">
                                <div class="p-2 bg-slate-800/80 rounded border border-slate-700 mt-1">
                                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-medium text-white line-clamp-2 leading-relaxed" x-text="job.files ? job.files.join(', ') : 'No files'"></p>
                                    <p class="text-xs text-indigo-300 mt-1.5 font-medium" x-show="job.stage" x-text="job.stage"></p>
                                    <p class="text-xs text-slate-400 mt-0.5 line-clamp-1" x-show="job.detail" x-text="job.detail"></p>
                                    
                                    <!-- Error message -->
                                    <div x-show="job.error" class="mt-3 p-3 bg-rose-500/10 border border-rose-500/20 rounded-lg">
                                        <p class="text-sm text-rose-400 font-mono break-all" x-text="job.error"></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Side: Progress / Actions -->
                        <div class="w-full md:w-1/3 flex flex-col justify-center min-w-[200px]">
                            
                            <!-- Progress Bar for Active/Queued -->
                            <div x-show="job.status === 'processing' || job.status === 'queued'" class="w-full">
                                <div class="flex justify-between items-end mb-2">
                                    <span class="text-xs font-semibold text-slate-300 uppercase tracking-wider">Progress</span>
                                    <span class="text-sm font-bold text-white" x-text="(job.progress || 0) + '%'"></span>
                                </div>
                                <div class="w-full h-3 bg-slate-800/80 rounded-full overflow-hidden border border-slate-700/50 block">
                                    <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_rgba(99,102,241,0.5)] relative"
                                         :style="`width: ${job.progress || 0}%`">
                                         <!-- Shimmer effect -->
                                         <div class="absolute inset-0 bg-white/20 w-full animate-[shimmer_2s_infinite]" style="background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent); transform: skewX(-20deg);"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- Actions for Completed -->
                            <div x-show="job.status === 'completed'" class="space-y-3">
                                
                                <!-- Output Download -->
                                <a :href="`/api/download/${id}`" download class="group flex items-center justify-center w-full px-4 py-2.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 hover:border-indigo-400/50 rounded-xl transition-all font-medium text-sm">
                                    <svg class="w-4 h-4 mr-2 group-hover:-translate-y-0.5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                    Download Excel
                                </a>

                                <!-- R2 Status (if applicable) -->
                                <div x-show="job.image_count > 0 || job.r2_base_path" class="p-3 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                    <div class="flex items-center mb-1.5">
                                        <svg class="w-4 h-4 text-orange-400 mr-1.5" fill="currentColor" viewBox="0 0 24 24"><path d="M19.333 4.667h-14.666c-1.104 0-2 .896-2 2v10.666c0 1.104.896 2 2 2h14.666c1.104 0 2-.896 2-2v-10.666c0-1.104-.896-2-2-2zm-3.833 8.333l-4 4-2.667-2.667 1.414-1.414 1.253 1.253 2.586-2.586 1.414 1.414z"/></svg>
                                        <span class="text-xs font-bold text-slate-300">Cloudflare R2 Sync</span>
                                    </div>
                                    <p class="text-[11px] text-slate-400 font-mono mb-1 truncate" x-text="job.r2_base_path ? `Path: /${job.r2_base_path}` : 'Path: Undefined'"></p>
                                    <span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                        <span x-text="job.image_count"></span>&nbsp;Images Uploaded
                                    </span>
                                </div>
                            </div>
                            
                            <!-- No actions needed for Failed natively -->

                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <style>
        @keyframes shimmer {
            0% { transform: translateX(-100%) skewX(-20deg); }
            100% { transform: translateX(200%) skewX(-20deg); }
        }
    </style>

    <script>
        function progressApp() {
            return {
                jobs: {},
                firstLoad: true,
                loading: false,
                pollInterval: null,

                get sortedJobs() {
                    // Convert object to array and sort by created_at (newest first)
                    return Object.entries(this.jobs).sort((a, b) => {
                        const dateA = new Date(a[1].created_at || 0);
                        const dateB = new Date(b[1].created_at || 0);
                        return dateB - dateA; // Descending
                    });
                },

                get jobsCount() { return Object.keys(this.jobs).length; },
                
                get activeJobsCount() {
                    return Object.values(this.jobs).filter(j => j.status === 'processing').length;
                },
                get queuedJobsCount() {
                    return Object.values(this.jobs).filter(j => j.status === 'queued').length;
                },
                get completedJobsCount() {
                    return Object.values(this.jobs).filter(j => j.status === 'completed').length;
                },
                get failedJobsCount() {
                    return Object.values(this.jobs).filter(j => j.status === 'failed').length;
                },

                formatDate(isoString) {
                    if (!isoString) return 'Unknown Time';
                    try {
                        const d = new Date(isoString + 'Z'); // Appending Z forces UTC parsing if missing
                        return new Intl.DateTimeFormat('default', {
                            month: 'short', day: 'numeric', 
                            hour: 'numeric', minute: '2-digit', second: '2-digit'
                        }).format(d);
                    } catch (e) {
                        return isoString;
                    }
                },

                async fetchJobs(isManual = false) {
                    if (isManual) this.loading = true;
                    try {
                        const response = await fetch('/api/jobs');
                        if (response.ok) {
                            const data = await response.json();
                            this.jobs = data; // Directly replace with source of truth
                        }
                    } catch (error) {
                        console.error('Error fetching jobs:', error);
                    } finally {
                        this.loading = false;
                        if (this.firstLoad) this.firstLoad = false;
                    }
                },

                init() {
                    this.fetchJobs();
                    // Poll every 2 seconds
                    this.pollInterval = setInterval(() => {
                        this.fetchJobs();
                    }, 2000);
                }
            }
        }
    </script>
</body>
</html>
